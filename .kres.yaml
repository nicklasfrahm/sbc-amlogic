---
kind: pkgfile.Build
spec:
  targets:
    - sbc-amlogic
  extraBuildArgs:
    - PKGS_PREFIX
    - PKGS
    - TOOLS_PREFIX
    - TOOLS
  makefile:
    extraVariables:
      - name: PKGS_PREFIX
        defaultValue: ghcr.io/siderolabs
      - name: PKGS
        defaultValue: v1.13.0-alpha.0
      - name: TOOLS_PREFIX
        defaultValue: ghcr.io/siderolabs
      - name: TOOLS
        defaultValue: v1.13.0-alpha.0
---
kind: common.Build
spec:
    ignoredPaths:
      - go.work.sum
---
kind: common.Renovate
spec:
  packageRules:
    - matchPackageNames:
        - u-boot/u-boot
      versioning: 'regex:^(?<major>\d+)\.(?<minor>\d+)\.?(?<patch>\d+)?$'
